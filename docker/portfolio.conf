ServerName localhost
ServerTokens Prod
ServerSignature Off

# .htaccess is not read in this image (AllowOverride None), so the rules from
# data/, inc/ and uploads/ .htaccess are enforced here instead. The Render disk
# mount also hides any .htaccess stored inside data/ or uploads/.

# Never serve stored content, the password hash, or PHP helpers.
<LocationMatch "^/(data|inc)(/|$)">
    Require all denied
</LocationMatch>

# Uploads are images only: never run or serve scripts from there.
<LocationMatch "^/uploads/.*\.(php[0-9]*|phtml|phar|pht)$">
    Require all denied
</LocationMatch>

# Render terminates TLS and forwards plain HTTP; tell PHP the original request was HTTPS
# so the admin session cookie gets the Secure flag.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
